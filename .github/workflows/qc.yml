name: 🔍 Revisar vídeos programados

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agencia
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            mkdir -p "$HOME/ffbin" && curl -sSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$HOME/ffbin" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            echo "$HOME/ffbin" >> "$GITHUB_PATH"
          fi
      - name: Revisar con visión
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENCIA_API: ${{ vars.AGENCIA_API || 'https://agencia-marketing.lopezsimrace29.workers.dev' }}
          AGENCIA_ADMIN_TOKEN: ${{ secrets.AGENCIA_ADMIN_TOKEN }}
        run: python scripts/qc_cola.py
      - name: Guardar
        run: |
          git config user.name "agencia-bot"
          git config user.email "agencia-bot@users.noreply.github.com"
          git add content || true
          git diff --cached --quiet || git commit -m "🔍 Revisión de vídeos programados"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 8; done
