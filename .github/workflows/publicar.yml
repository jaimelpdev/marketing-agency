name: 📤 Publicar en Instagram

on:
  schedule:
    - cron: "*/20 * * * *"   # revisa la cola cada 20 minutos y publica lo que toque
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agencia
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: ¿Hay algo que publicar ya?
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, glob
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          due = any(q.get("status") == "pending" and datetime.fromisoformat(q["publishAt"]) <= now
                    for f in glob.glob("content/users/*/queue.json") for q in json.load(open(f)))
          print("due=" + ("true" if due else "false"))
          PY

  publicar:
    needs: revisar
    if: needs.revisar.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publicar lo que toca
        env:
          AGENCIA_API: ${{ vars.AGENCIA_API || 'https://agencia-marketing.lopezsimrace29.workers.dev' }}
          AGENCIA_ADMIN_TOKEN: ${{ secrets.AGENCIA_ADMIN_TOKEN }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python scripts/publish.py

      - name: Guardar estado de la cola
        run: |
          git config user.name "agencia-bot"
          git config user.email "agencia-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "📤 Publicación $(date -u +%FT%H:%M)" && git pull --rebase && git push)
