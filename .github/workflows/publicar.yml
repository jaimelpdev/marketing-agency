name: 📤 Publicar en Instagram

on:
  schedule:
    - cron: "*/20 * * * *"   # revisa la cola cada 20 minutos y publica lo que toque
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agencia
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publicar lo que toca
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python scripts/publish.py

      - name: Guardar estado de la cola
        run: |
          git config user.name "agencia-bot"
          git config user.email "agencia-bot@users.noreply.github.com"
          git add content/queue.json
          git diff --cached --quiet || (git commit -m "📤 Publicación $(date -u +%FT%H:%M)" && git pull --rebase && git push)
