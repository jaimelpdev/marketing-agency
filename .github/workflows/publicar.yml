name: 📤 Publicar en Instagram

on:
  schedule:
    - cron: "*/20 * * * *"   # revisa la cola cada 20 minutos y publica lo que toque
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agencia
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
      requests: ${{ steps.req.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: ¿Hay algo que publicar ya?
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, glob
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          due = any(q.get("status") == "pending" and datetime.fromisoformat(q["publishAt"]) <= now
                    for f in glob.glob("content/users/*/queue.json") for q in json.load(open(f)))
          print("due=" + ("true" if due else "false"))
          PY
      - id: req
        name: ¿Alguien ha pedido rehacer o reiniciar algo desde la app?
        env:
          AGENCIA_API: ${{ vars.AGENCIA_API || 'https://agencia-marketing.lopezsimrace29.workers.dev' }}
        run: |
          r=$(curl -sS --max-time 20 -w ' HTTP%{http_code}' "$AGENCIA_API/pending" || echo "error de conexión")
          echo "Respuesta del servidor: $r"
          case "$r" in *'"pending":true'*) p=true;; *) p=false;; esac
          echo "pending=$p" >> "$GITHUB_OUTPUT"

  peticiones:
    needs: revisar
    if: needs.revisar.outputs.requests == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Lanzar la agencia para atender las peticiones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh api "repos/${{ github.repository }}/actions/workflows/planificar.yml/runs?status=in_progress" --jq '.total_count')
          queued=$(gh api "repos/${{ github.repository }}/actions/workflows/planificar.yml/runs?status=queued" --jq '.total_count')
          if [ "$busy" = "0" ] && [ "$queued" = "0" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/planificar.yml/dispatches" -f ref=main
          else
            echo "La agencia ya está trabajando; se atenderá en esa ejecución o en la siguiente."
          fi

  publicar:
    needs: revisar
    if: needs.revisar.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publicar lo que toca
        env:
          AGENCIA_API: ${{ vars.AGENCIA_API || 'https://agencia-marketing.lopezsimrace29.workers.dev' }}
          AGENCIA_ADMIN_TOKEN: ${{ secrets.AGENCIA_ADMIN_TOKEN }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python scripts/publish.py

      - name: Guardar estado de la cola
        run: |
          git config user.name "agencia-bot"
          git config user.email "agencia-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "📤 Publicación $(date -u +%FT%H:%M)" && git pull --rebase && git push)
