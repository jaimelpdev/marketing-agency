name: 🎬 Demo reel con Veo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Montar el reel
        run: python scripts/demo_veo.py
      - name: Guardar
        run: |
          git config user.name "agencia-bot"
          git config user.email "agencia-bot@users.noreply.github.com"
          git add docs/demo content/music || true
          git diff --cached --quiet || git commit -m "🎬 Demo reel con Veo"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 8; done
