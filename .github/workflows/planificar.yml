name: 🧠 Planificar y crear contenido

on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC (06:17/07:17 en España). Si ya hay plan en marcha, no hace nada.
  workflow_dispatch:
    inputs:
      force:
        description: "Rehacer el plan aunque ya haya uno en marcha"
        type: boolean
        default: false
      only_user:
        description: "Solo esta persona (id u_…); vacío = todas"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agencia
  cancel-in-progress: false

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji

      - name: Planificar y renderizar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          AGENCIA_API: ${{ vars.AGENCIA_API || 'https://agencia-marketing.lopezsimrace29.workers.dev' }}
          AGENCIA_ADMIN_TOKEN: ${{ secrets.AGENCIA_ADMIN_TOKEN }}
          ONLY_USER: ${{ github.event.inputs.only_user }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python scripts/daily.py

      - name: Guardar en el repositorio
        run: |
          git config user.name "agencia-bot"
          git config user.email "agencia-bot@users.noreply.github.com"
          git add -A content docs
          git diff --cached --quiet || git commit -m "🧠 Plan y contenido $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
