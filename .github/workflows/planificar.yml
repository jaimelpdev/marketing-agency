name: 🧠 Planificar y crear contenido

on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC (06:17/07:17 en España). Si ya hay plan en marcha, no hace nada.
  workflow_dispatch:
    inputs:
      force:
        description: "Rehacer el plan aunque ya haya uno en marcha"
        type: boolean
        default: false
      only_user:
        description: "Solo esta persona (id u_…); vacío = todas"
        type: string
        default: ""
      prueba:
        description: "Crear contenido de prueba aunque no haya redes conectadas (no se publica nada)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agencia
  cancel-in-progress: false

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # siempre lo último (no la versión del momento en que se pidió la ejecución)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -q -r requirements.txt
          # el runner ya trae Google Chrome: se usa ese y no se descarga otro navegador (ahorra mucho tiempo)
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
          # ffmpeg y la fuente de emojis sin apt (apt a veces tarda 15 minutos en los servidores de GitHub)
          if ! command -v ffmpeg >/dev/null; then
            mkdir -p "$HOME/ffbin" && curl -sSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$HOME/ffbin" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            echo "$HOME/ffbin" >> "$GITHUB_PATH"; export PATH="$HOME/ffbin:$PATH"
          fi
          if ! fc-list | grep -qi "Noto Color Emoji"; then
            mkdir -p "$HOME/.local/share/fonts" && curl -sSL --retry 3 -o "$HOME/.local/share/fonts/NotoColorEmoji.ttf" https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf && fc-cache -f >/dev/null
          fi
          ffmpeg -version | head -1

      - name: Planificar y renderizar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AGENCIA_API: ${{ vars.AGENCIA_API || 'https://agencia-marketing.lopezsimrace29.workers.dev' }}
          AGENCIA_ADMIN_TOKEN: ${{ secrets.AGENCIA_ADMIN_TOKEN }}
          ONLY_USER: ${{ github.event.inputs.only_user }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          PRUEBA: ${{ github.event.inputs.prueba == 'true' && '1' || '' }}
        run: python scripts/daily.py

      - name: Guardar en el repositorio
        run: |
          git config user.name "agencia-bot"
          git config user.email "agencia-bot@users.noreply.github.com"
          git add -A content docs
          git diff --cached --quiet || git commit -m "🧠 Plan y contenido $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 8; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
